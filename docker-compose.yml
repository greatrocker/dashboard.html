  # 跨交易所強力買偵測（所有交易所對 × 所有幣種，24 小時寫入 dbo.StrongBuySignals）
  signal-detector:
    <<: *rest-ticker
    container_name: signal-detector
    command: python -u signal_detector.py
    environment:
      <<: *ticker-env
      HEARTBEAT_PORT: "9020"
      WINDOW_MINUTES: "5"      # 逐秒精確計算的均值區間（分鐘）
      WINDOWS: "5,15,30,60,240,720,1440"   # 同時偵測的均值區間（分鐘）；> 5 分鐘以每分鐘平均價計算
      MIN_ROUND_TRIP: "-0.3"   # 獲利空間（Open Gap + Close Gap）>= -0.3%：兩邊買賣價差合計 <= 0.3% 才記錄
      MAX_SPOT_SPREAD: "0.1"   # 現貨端 (Ask − Bid) / Bid <= 0.1%（擋洗盤 / 套利陷阱）
      MAX_CONTRACT_SPREAD: "0.1"   # 合約端 (Ask − Bid) / Bid <= 0.1%
      PAPER_WINDOW: "5"        # 模擬交易只跟這個均值區間的訊號開倉
      STRONG_BUY_DEV: "0.5"    # 強力買門檻：Open Gap 偏離均值 > 0.5%
      MIN_OPEN_GAP: "0.2"      # 且現在的 Open Gap > 0.2%（扣手續費後仍有利可圖）
      MIN_CAPACITY_USD: "1000" # 且即時訂單簿可套利金額 >= 1000 USDT（過濾掛單太薄的交易所）
      RECHECK_SECONDS: "30"    # 掛單不足的組合 30 秒後再查
      MAX_CHECK_AGE: "5"       # 送出查訂單簿後超過 5 秒沒查到 → 丟棄該訊號，不用過時訊號開倉
      BOOK_TIMEOUT: "4.5"      # 單次查訂單簿最多等 4.5 秒（需小於 MAX_CHECK_AGE）
      MAX_INFLIGHT: "20"       # 同時查訂單簿的組合上限；有空位時依偏離大小優先
      # 套利模擬交易：每筆強力買用盡可套利金額開倉，扣手續費後 >= +0.1% 或 Open Gap 回到均值即平倉
      TAKE_PROFIT_PCT: "0.1"   # 停利：扣 4 筆手續費後淨報酬率（%）
      SPOT_FEE: "0.001"        # 現貨手續費 0.1%
      CONTRACT_FEE: "0.0005"   # 合約手續費 0.05%
      MIN_POINTS: "30"         # 至少 30 筆配對資料才判斷
      STALE_SECONDS: "10"      # 行情落後超過 10 秒的組合跳過
    ports:
      - "9020:9020"
    volumes:
      - ./logs:/app/logs
      - ./exchange_api_common.py:/app/exchange_api_common.py
      - ./rest_ticker_common.py:/app/rest_ticker_common.py
      - ./orderbook_depth.py:/app/orderbook_depth.py
      - ./paper_trader.py:/app/paper_trader.py
      - ./signal_detector.py:/app/signal_detector.py

