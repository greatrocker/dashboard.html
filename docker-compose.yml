# 前 20 大擴充的 REST Ticker 共用設定（bitget-ticker ~ pionex-ticker）
x-rest-ticker: &rest-ticker
  build: .
  restart: unless-stopped
  dns:
    - 8.8.8.8
    - 1.1.1.1
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-ticker-env: &ticker-env
  TZ: Asia/Taipei
  MSSQL_SERVER: ${MSSQL_SERVER}
  MSSQL_DATABASE: ${MSSQL_DATABASE}
  MSSQL_USER: ${MSSQL_USER}
  MSSQL_PASSWORD: ${MSSQL_PASSWORD}
  TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

services:

  exchange-api:
    build: .
    container_name: exchange-monitor-api
    restart: unless-stopped
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=Asia/Taipei
      - MSSQL_SERVER=${MSSQL_SERVER}
      - MSSQL_DATABASE=${MSSQL_DATABASE}
      - MSSQL_USER=${MSSQL_USER}
      - MSSQL_PASSWORD=${MSSQL_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - ./static:/app/static
      - ./logs:/app/logs
      - ./config.py:/app/config.py
      - ./api_server.py:/app/api_server.py
      - ./exchange_api_common.py:/app/exchange_api_common.py
      - ./bybit_api.py:/app/bybit_api.py
      - ./binance_api.py:/app/binance_api.py
      - ./okx_api.py:/app/okx_api.py
      - ./mexc_api.py:/app/mexc_api.py
      - ./gate_api.py:/app/gate_api.py
      - ./bitget_api.py:/app/bitget_api.py
      - ./kucoin_api.py:/app/kucoin_api.py
      - ./htx_api.py:/app/htx_api.py
      - ./bingx_api.py:/app/bingx_api.py
      - ./cryptocom_api.py:/app/cryptocom_api.py
      - ./kraken_api.py:/app/kraken_api.py
      - ./coinbase_api.py:/app/coinbase_api.py
      - ./bitfinex_api.py:/app/bitfinex_api.py
      - ./whitebit_api.py:/app/whitebit_api.py
      - ./xt_api.py:/app/xt_api.py
      - ./phemex_api.py:/app/phemex_api.py
      - ./poloniex_api.py:/app/poloniex_api.py
      - ./deepcoin_api.py:/app/deepcoin_api.py
